[metadata]
name = creepy
license_files = LICENSE.txt

[options]
zip_safe = False
install_requires =
    cryptography[ssh] >=39.0.0
    starlette
    requests
packages = find:
package_dir =
    = src

[options.packages.find]
where = src

[options.extras_require]
dev =
    pre-commit
    ruff
test =
    pytest
    psutil

[options.entry_points]
console_scripts =
    creepy = creepy.cli:app
