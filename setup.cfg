[metadata]
name = creepy
license_files = LICENSE.txt

[options]
zip_safe = False
install_requires =
    cryptography[ssh] >=39.0.0
    starlette
    requests
packages = find:
package_dir =
    = src

[options.packages.find]
where = src

[options.extras_require]
dev =
    pre-commit
    ruff
docs =
    sphinx
    myst_parser
    sphinx-autoapi
    pydata_sphinx_theme
    numpydoc
tests =
    pytest
    psutil
# Compatibility for existing creepy[test] installs.
test =
    creepy[tests]

[options.entry_points]
console_scripts =
    creepy = creepy.cli:app
